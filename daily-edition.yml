name: THE DAILY — Weekday Edition

on:
  schedule:
    # 7:00 AM Singapore Time (UTC+8) = 23:00 UTC the previous day.
    # Mon–Fri SGT mornings = Sun 23:00 UTC through Thu 23:00 UTC.
    - cron: '0 23 * * 0-4'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab, for testing

permissions:
  contents: write   # required so this workflow can commit + push with the built-in token

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  publish-edition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet groq feedparser

      - name: Research (free RSS) + write today's edition JSON (free Groq API)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/generate_edition.py

      - name: Build static site from data/*.json
        run: python3 generate.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "the-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi
          git commit -m "THE DAILY: $(date -u +%Y-%m-%d) edition"
          git push
